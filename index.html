<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarte de Celular</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1695978918861-6f93447068bc?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover; background-position: center; background-attachment: fixed;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px; border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center; max-width: 440px; width: 90%;
            max-height: 90vh; overflow-y: auto;
        }
        h1 { color: #333; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

        /* Camera section emphasized at the top */
        .camera-section {
            background-color: #f0f7ff;
            border: 2px dashed #007bff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .camera-section label {
            display: block;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .camera-section input[type="file"] {
            width: 100%;
            font-size: 14px;
        }

        /* Two-column layout row */
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .input-group {
            flex: 1;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        select:focus, textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
        }
        textarea {
            height: 55px;
            resize: none;
        }

        /* Tags selection button grids */
        .tags-container {
            display: flex; flex-wrap: wrap; gap: 6px;
            justify-content: center; margin-bottom: 20px;
        }
        .tag-checkbox { display: none; }
        .tag-label {
            background-color: #f0f0f0; color: #444;
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease; border: 1px solid #ddd;
            user-select: none;
        }
        .tag-checkbox:checked + .tag-label {
            background-color: #e0a800; color: #212529;
            border-color: #d39e00; box-shadow: 0 2px 6px rgba(224,168,0,0.3);
        }

        button[type="submit"] {
            background-color: #007bff; color: white; border: none;
            padding: 14px 20px; font-size: 16px; border-radius: 8px;
            cursor: pointer; width: 100%; font-weight: bold;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descartar Celular</h1>
        <p class="subtitle">Completa el registro del dispositivo a desechar</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <!-- 1. CÁMARA (Prioritized and styled first) -->
            <div class="camera-section">
                <label for="cameraInput">📸 Captura una foto de la parte trasera del teléfono (Obligatorio)</label>
                <input type="file" id="cameraInput" name="photo" accept="image/*" capture="environment" required>
            </div>

            <!-- 2. BRAND & MODEL IN AN ALPHABETICAL ORDER -->
            <div class="form-row">
                <div class="input-group">
                    <label for="marcaSelect">Marca:</label>
                    <select id="marcaSelect" name="marca">
                        <!-- Default placeholder -->
                        <option value="desconocida" selected>Desconocida</option>

                        <!-- 20 Alphabetical Brands -->
                        <option value="alcatel">Alcatel</option>
                        <option value="acer">Acer</option>
                        <option value="apple">Apple (iPhone)</option>
                        <option value="asus">Asus</option>
                        <option value="blackberry">Blackberry</option>
                        <option value="bgh">BGH</option>
                        <option value="google">Google</option>
                        <option value="htc">HTC</option>
                        <option value="huawei">Huawei</option>
                        <option value="kodak">Kodak</option>
                        <option value="lenovo">Lenovo</option>
                        <option value="lg">LG</option>
                        <option value="motorola">Motorola</option>
                        <option value="noblex">Noblex</option>
                        <option value="nokia">Nokia</option>
                        <option value="oppo">Oppo</option>
                        <option value="philips">Philips</option>
                        <option value="quantum">Quantum</option>
                        <option value="realme">Realme</option>
                        <option value="samsung">Samsung</option>
                        <option value="sony">Sony</option>
                        <option value="sony_ericsson">Sony Ericsson</option>
                        <option value="tcl">TCL</option>
                        <option value="vivo">Vivo</option>
                        <option value="xiaomi">Xiaomi</option>
                        <option value="zte">ZTE</option>

                        <!-- Extra fallback option -->
                        <option value="otra">Otra marca...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="modeloInput">Modelo (Si lo conoce):</label>
                    <input type="text" id="modeloInput" name="modelo" placeholder="Ej: Galaxy S20, Moto G20">
                </div>
            </div>

            <!-- 3. MOTIVOS / TAGS -->
            <div class="input-group" style="margin-bottom: 8px;">
                <label>Selecciona el/los motivos del descarte:</label>
            </div>
            <div class="tags-container">
                <input type="checkbox" name="motivos" value="pantalla_rota" id="tag1" class="tag-checkbox">
                <label for="tag1" class="tag-label">📱 Pantalla Rota</label>

                <input type="checkbox" name="motivos" value="bateria_inflada" id="tag2" class="tag-checkbox">
                <label for="tag2" class="tag-label">🔋 Batería Dañada</label>

                <input type="checkbox" name="motivos" value="no_enciende" id="tag3" class="tag-checkbox">
                <label for="tag3" class="tag-label">🔌 No Enciende</label>

                <input type="checkbox" name="motivos" value="obsoleto" id="tag4" class="tag-checkbox">
                <label for="tag4" class="tag-label">⏳ Obsoleto / Lento</label>

                <input type="checkbox" name="motivos" value="mojado" id="tag5" class="tag-checkbox">
                <label for="tag5" class="tag-label">💧 Mojado</label>
            </div>

            <!-- 4. NOTAS ADICIONALES -->
            <div class="input-group">
                <label for="descripcionInput">Notas adicionales (opcional):</label>
                <textarea id="descripcionInput" name="descripcion" placeholder="Escribe detalles o comentarios adicionales aquí..."></textarea>
            </div>

            <button type="submit">Enviar Registro</button>
        </form>
    </div>

</body>
</html>
